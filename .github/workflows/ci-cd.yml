name: Wasslni Mobile APK & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build Android APKs in Cloud
  build-mobile-apks:
    name: Build Wasslni Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffolding & Build Unified Wasslni App APK
        working-directory: apps/wasslni-app
        run: |
          # Back up custom AndroidManifest before scaffolding
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android --org=ma.wasslni --project-name=wasslni_app
          # Restore full production AndroidManifest with INTERNET and network permissions
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Ensure compatible modern Kotlin version in android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          # Restore custom high-res branded launcher icons
          cp -r ../../assets/icons/app/* android/app/src/main/res/
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../wasslni.apk

      - name: Upload Unified App APK
        uses: actions/upload-artifact@v4
        with:
          name: wasslni-unified-app-release-apk
          path: wasslni.apk

      - name: Scaffolding & Build Rider App APK
        working-directory: apps/rider-app
        run: |
          flutter create . --platforms=android --org=ma.wasslni --project-name=rider_app
          cp -r ../../assets/icons/rider/* android/app/src/main/res/
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../wasslni-rider.apk

      - name: Upload Rider App APK
        uses: actions/upload-artifact@v4
        with:
          name: wasslni-rider-app-release-apk
          path: wasslni-rider.apk

      - name: Scaffolding & Build Driver App APK
        working-directory: apps/driver-app
        run: |
          flutter create . --platforms=android --org=ma.wasslni --project-name=driver_app
          cp -r ../../assets/icons/driver/* android/app/src/main/res/
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../wasslni-driver.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: wasslni-driver-app-release-apk
          path: wasslni-driver.apk

      - name: Publish to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "وصّلني - النسخة الرسمية للموبايل v1.0.0"
          body: |
            ### 🚗 تطبيق وصّلني (Wasslni Morocco) - الإصدار الرسمي الموحد 🇲🇦
            
            تم دمج التطبيق بالكامل في تطبيق واحد موحد يتيح للمستخدم الاختيار والتبديل بكل سهولة:
            - **تطبيق موحد متكامل (All-in-One)**: `wasslni.apk` - يختار المستخدم عند الدخول (أنا راكب أو أنا سائق كابتن)، مع إمكانية التبديل في أي لحظة من القائمة الجانبية.
            - **محرك الخرائط المحدث (Esri World Street Map HD)**: بدون سيارات وهمية أو مسارات مصطنعة، نظيف وسلس وسريع.
            - **الوضع النهاري الفاخر (Day Mode)**: هوية مغربية ملكية أصيلة (#0B3D2E و#C9A24B).
            - **حزم فردية اختيارية**: تظل متوفرة لمن يرغب في تثبيت تطبيق الراكب فقط أو تطبيق السائق فقط بشكل منفصل.
            
            #### 📥 روابط التحميل المباشرة:
            - 🌟 **التطبيق الموحد (الراكب + السائق معا)**: `wasslni.apk` (موصى به)
            - 👤 **تطبيق الراكب المنفصل**: `wasslni-rider.apk`
            - 🚕 **تطبيق السائق المنفصل**: `wasslni-driver.apk`
          files: |
            wasslni.apk
            wasslni-rider.apk
            wasslni-driver.apk
