version: '3.8'

services:
  # PostgreSQL 16 + PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wasslni_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-wasslni_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wasslni_secret_2026}
      POSTGRES_DB: ${DB_NAME:-wasslni_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - wasslni_network

  # Redis 7 for Live Geolocation, Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: wasslni_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-wasslni_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - wasslni_network

  # Wasslni Backend Modular API
  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: wasslni_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-wasslni_admin}:${DB_PASSWORD:-wasslni_secret_2026}@postgres:5432/${DB_NAME:-wasslni_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wasslni_redis_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_moroccan_jwt_wasslni_2026}
      MAP_PROVIDER: ${MAP_PROVIDER:-self_hosted}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      PHOTON_URL: ${PHOTON_URL:-http://photon:2322}
      ORS_API_KEY: ${ORS_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - wasslni_network

  # OSRM Self-Hosted Routing Engine (Morocco OSM dataset)
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: wasslni_osrm
    restart: always
    command: osrm-routed --algorithm mld /data/morocco-latest.osrm --max-table-size 1000
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - osrmdata:/data
    networks:
      - wasslni_network

  # Photon Self-Hosted Geocoder (Morocco OpenStreetMap extract)
  photon:
    image: komoot/photon:latest
    container_name: wasslni_photon
    restart: always
    ports:
      - "${PHOTON_PORT:-2322}:2322"
    volumes:
      - photondata:/photon/photon_data
    environment:
      JAVA_OPTS: "-Xmx2g"
    networks:
      - wasslni_network

volumes:
  pgdata:
  redisdata:
  osrmdata:
  photondata:

networks:
  wasslni_network:
    driver: bridge

