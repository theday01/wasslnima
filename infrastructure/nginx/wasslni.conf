# Nginx Production Configuration for Wasslni Platform
# Domain: wasslni.ma

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;

# Upstream Backend API
upstream wasslni_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wasslni.ma api.wasslni.ma admin.wasslni.ma;
    return 301 https://$host$request_uri;
}

# 1. API & WebSocket Server (api.wasslni.ma)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wasslni.ma;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.wasslni.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wasslni.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting for OTP
    location /api/v1/auth/send-otp {
        limit_req zone=otp_limit burst=3 nodelay;
        proxy_pass http://wasslni_backend;
        include /etc/nginx/proxy_params;
    }

    # REST API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://wasslni_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebSocket Real-Time Engine (Socket.IO)
    location /socket.io/ {
        proxy_pass http://wasslni_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. Admin Web Dashboard (admin.wasslni.ma)
server {
    listen 443 ssl http2;
    server_name admin.wasslni.ma;

    ssl_certificate /etc/letsencrypt/live/admin.wasslni.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.wasslni.ma/privkey.pem;

    root /var/www/wasslni/apps/admin-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

